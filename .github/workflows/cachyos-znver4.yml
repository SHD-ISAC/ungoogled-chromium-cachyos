name: Build CachyOS znver4 package

on:
    workflow_dispatch:
    push:
        branches:
            - cachyos-znver4
        paths:
            - PKGBUILD
            - '*.patch'
            - fetch-chromium-release

permissions:
    contents: read
    packages: write
    actions: write

concurrency:
    group: ungoogled-chromium-cachyos-znver4
    cancel-in-progress: true

jobs:
    build-container:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        container:
            image: archlinux
            volumes:
                - /:/host
        steps:
            - name: Verify runner supports x86-64-v4
              run: |
                  flags=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2) "
                  for f in avx avx2 bmi1 bmi2 fma movbe avx512f avx512bw avx512cd avx512dq avx512vl; do
                    [[ "$flags" == *" $f "* ]] || { echo "Missing x86-64-v4 CPU flag: $f"; exit 1; }
                  done
                  lscpu | grep -E 'Model name|CPU\\(s\\)'
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
            - name: Install build-container dependencies
              run: pacman -Syu --needed --noconfirm docker base-devel
            - name: Free runner disk space
              run: |
                  rm -rf /host/usr/share/dotnet
                  rm -rf /host/usr/local/lib/android
                  rm -rf /host/opt/ghc
                  rm -rf /host/opt/hostedtoolcache/CodeQL
                  docker image prune --all --force || true
            - name: Log in to GitHub Container Registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Generate source bundle and build staged image
              id: image
              shell: bash
              run: |
                  set -euo pipefail
                  useradd makepkg --no-create-home
                  chown -R makepkg .

                  su -c "makepkg --allsource" makepkg

                  source PKGBUILD
                  VERSION="$pkgver-$pkgrel"
                  IMAGE="ghcr.io/${{ github.repository_owner }}/ungoogled-chromium-cachyos-build"
                  IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
                  TAG="$IMAGE:${{ github.run_id }}"

                  docker build . \
                    --file .github/workflows/cachyos-znver4-container/Dockerfile \
                    --tag "$TAG"

                  docker push "$TAG"

                  echo "chromium-version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "image-tag=$TAG" >> "$GITHUB_OUTPUT"
        outputs:
            chromium-version: "${{ steps.image.outputs.chromium-version }}"
            image-tag: "${{ steps.image.outputs.image-tag }}"

    build-1:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        needs: build-container
        steps:
            - name: Verify runner supports x86-64-v4
              run: |
                  flags=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2) "
                  for f in avx avx2 bmi1 bmi2 fma movbe avx512f avx512bw avx512cd avx512dq avx512vl; do
                    [[ "$flags" == *" $f "* ]] || { echo "Missing x86-64-v4 CPU flag: $f"; exit 1; }
                  done
                  lscpu | grep -E 'Model name|CPU\\(s\\)'
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
            - name: Setup staged build action
              run: npm run setup --prefix ./.github/actions/stage
            - name: Run staged build
              id: stage
              uses: ./.github/actions/stage
              with:
                  finished: "${{ join(needs.*.outputs.finished) }}"
                  chromium-version: "${{ join(needs.*.outputs.chromium-version) }}"
                  use-registry: true
                  registry-token: "${{ secrets.GITHUB_TOKEN }}"
                  image-tag: "${{ join(needs.*.outputs.image-tag) }}"
        outputs:
            finished: "${{ steps.stage.outputs.finished }}"
            chromium-version: "${{ steps.stage.outputs.chromium-version }}"
            image-tag: "${{ steps.stage.outputs.image-tag }}"

    build-2:
