name: Build CachyOS znver4 on self-hosted Zen4

on:
  push:
    branches:
      - cachyos-znver4
    tags:
      - 'znver4-*'
    paths:
      - PKGBUILD
      - '*.patch'
      - fetch-chromium-release
      - cachyos-build.sh
      - .github/workflows/cachyos-znver4.yml

permissions:
  contents: write

concurrency:
  group: ungoogled-chromium-cachyos-znver4-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build znver4 package
    runs-on: [self-hosted, Linux, X64, zen4]
    timeout-minutes: 1440

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify Zen4 / x86-64-v4 runner
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner:"
          uname -a
          lscpu | grep -E 'Architecture|Model name|CPU\(s\)' || true

          flags=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2) "
          required=(avx avx2 bmi1 bmi2 fma movbe avx512f avx512bw avx512cd avx512dq avx512vl)

          for flag in "${required[@]}"; do
            [[ "$flags" == *" $flag "* ]] || {
              echo "Missing required x86-64-v4 CPU flag: $flag" >&2
              exit 1
            }
          done

          command -v docker
          docker info >/dev/null
          command -v pacman

          echo "x86-64-v4 CPU feature check passed."
          echo "Docker and pacman are available."

      - name: Clean stale package outputs
        shell: bash
        run: |
          rm -f ./ungoogled-chromium-*.pkg.tar.zst ./SHA256SUMS

      - name: Build with official CachyOS znver4 environment
        shell: bash
        run: ./cachyos-build.sh

      - name: Verify package and generate checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./ungoogled-chromium-*.pkg.tar.zst)
          ((${#packages[@]} > 0)) || {
            echo "No package was produced." >&2
            exit 1
          }

          for pkg in "${packages[@]}"; do
            echo "==> $pkg"
            pacman -Qip "$pkg" | grep -E '^(Name|Version|Architecture|Packager)'

            arch="$(pacman -Qip "$pkg" | awk -F ': *' '$1 == "Architecture" { print $2; exit }')"
            [[ "$arch" == "x86_64_v4" ]] || {
              echo "Unexpected package architecture: $arch" >&2
              exit 1
            }
          done

          sha256sum "${packages[@]}" | tee SHA256SUMS

          source ./PKGBUILD
          echo "version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"
          echo "Package architecture verified as x86_64_v4."

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ungoogled-chromium-${{ steps.meta.outputs.version }}-znver4
          path: |
            ./ungoogled-chromium-*.pkg.tar.zst
            ./SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/znver4-') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: ungoogled-chromium ${{ steps.meta.outputs.version }} — CachyOS znver4
          body: |
            Self-hosted Zen4 build of ungoogled-chromium for CachyOS.

            - Package architecture: x86_64_v4
            - Build tuning: -march=znver4
            - Build environment: cachyos/docker-makepkg-znver4
            - Source commit: ${{ github.sha }}

            SHA-256 checksums are included in SHA256SUMS.
          files: |
            ./ungoogled-chromium-*.pkg.tar.zst
            ./SHA256SUMS
          fail_on_unmatched_files: true
